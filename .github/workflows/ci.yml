name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-e-testes:
    name: Build e testes (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar testes
        run: ./mvnw --batch-mode verify

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          retention-days: 7

  imagem-docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-e-testes

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Valida que o Dockerfile continua íntegro. Não publica a imagem em registry:
      # o deploy é feito manualmente via docker compose.
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tcc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
