spring.application.name=health-wallet

# H2
spring.datasource.url=jdbc:h2:mem:healthwallet
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# JWT (UC01)
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A713474}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# OTP / E-mail (UC01)
# Enquanto app.mail.enabled=false, o código OTP é apenas logado no console (modo dev),
# evitando a necessidade de credenciais SMTP para rodar o projeto localmente.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@healthwallet.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2 / Calendar (RF06, UC01)
# Crie um projeto no Google Cloud Console (APIs & Services > Credentials) e
# preencha as variáveis de ambiente abaixo com o Client ID/Secret gerados.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# Para onde o backend redireciona o navegador após o consentimento do Google,
# já com o JWT na querystring (fluxo SPA - UC01/RF06).
app.frontend.google-callback-url=${FRONTEND_GOOGLE_CALLBACK_URL:http://localhost:4200/auth/google/callback}